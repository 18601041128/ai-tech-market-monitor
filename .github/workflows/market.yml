name: Update A-share Market Data

on:
  workflow_dispatch:

  schedule:
    # 全部为 UTC，对应北京时间如下：

    # 08:25 盘前历史数据准备
    - cron: "25 0 * * 1-5"

    # 09:35
    - cron: "35 1 * * 1-5"

    # 10:05、10:35
    - cron: "5,35 2 * * 1-5"

    # 11:05、11:35
    - cron: "5,35 3 * * 1-5"

    # 13:05、13:35
    - cron: "5,35 5 * * 1-5"

    # 14:05、14:35
    - cron: "5,35 6 * * 1-5"

    # 15:05
    - cron: "5 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update-market:

    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live market data
        run: |
          python fetch_market.py

      - name: Save scheduled snapshot
        run: |
          python save_snapshot.py

      - name: Update historical indicators
        run: |
          python fetch_history.py

      - name: Show live data status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/etf_live.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          print("Fetched:", d.get("fetched_at"))
          print("Counts:", d.get("counts"))

          for code in [
              "159381",
              "588000",
              "588230",
              "588200",
              "515880",
              "562500",
              "516510"
          ]:
              q = d["quotes"].get(code, {})
              print(
                  code,
                  q.get("price"),
                  q.get("pct"),
                  q.get("status"),
                  q.get("source_time")
              )
          PY

      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market monitoring data"
            git push
          fi
