name: Update A-share Market Data

on:
  workflow_dispatch:

  schedule:
    # GitHub cron 使用 UTC
    # 北京时间 09:00-15:59，工作日每5分钟运行一次
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market data
        run: |
          python fetch_market.py

      - name: Show result
        run: |
          echo "===== Market JSON ====="
          cat data/etf_live.json

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/etf_live.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market data"
            git push
          fi
